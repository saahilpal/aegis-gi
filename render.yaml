services:
  # Backend API service
  - type: web
    name: aegis-gi-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: aegis-gi-db
          property: connectionString
      - key: USE_PGVECTOR
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://frontend-rho-indol-95.vercel.app,http://localhost:3000"

databases:
  - name: aegis-gi-db
    databaseName: aegis_db_5eua
    plan: free
    region: oregon
