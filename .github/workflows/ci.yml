name: CI/CD Quality Gate & Automated Deployment

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-quality-gate:
    name: Backend Pytest & Evaluation Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Unit Tests
        run: |
          pytest -v

      - name: Run Outcome Verification Benchmark & Quality Gate
        run: |
          python -m backend.app.evaluation.ci_check

  frontend-quality-gate:
    name: Frontend Lint, Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run TypeScript Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build Next.js Application
        working-directory: frontend
        run: npm run build

  deploy-and-smoke-test:
    name: Auto-Deploy to Production & Live Smoke Test
    needs: [backend-quality-gate, frontend-quality-gate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trigger Backend Deployment (Render / Cloud Run)
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering backend production deployment via webhook..."
          curl -s -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Deploy Frontend to Vercel
        if: env.VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./frontend

      - name: Run Live Production Smoke Test
        if: env.LIVE_BACKEND_URL != ''
        env:
          LIVE_BACKEND_URL: ${{ secrets.LIVE_BACKEND_URL }}
        run: |
          python -m pip install requests
          python scripts/smoke_test.py --url "$LIVE_BACKEND_URL"
